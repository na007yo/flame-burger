*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}button{font:inherit}.app{position:fixed;inset:0}.stage{position:absolute;inset:0;background:#080604;perspective:1200px;overflow:hidden}.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter .8s,opacity .7s;transform:scale(1.06)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,#0004 48%,#0002),linear-gradient(0deg,#000c,transparent 55%)}.top{position:fixed;z-index:20;left:0;right:0;top:0;padding:20px 4%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#000c,transparent)}.logo{font-weight:1000;color:#ff5a22;letter-spacing:2px}.step{font-size:11px;letter-spacing:2px;color:#d9c8b7}.narr{position:fixed;z-index:15;left:5%;bottom:7%;max-width:620px}.narr .ey{font-size:11px;color:#ff7647;letter-spacing:4px;font-weight:900}.narr h1{font-size:clamp(38px,6vw,82px);line-height:.92;letter-spacing:-3px;margin:10px 0 16px}.narr p{color:#eadfd3;line-height:1.65;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:99px;padding:14px 20px;background:#ff511b;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 12px 30px #ff511b3c}.btn.alt{background:#16100ce8;border:1px solid #ffffff2a}.hot{position:absolute;z-index:8;border:1px solid #ffffff55;background:#0008;color:white;border-radius:99px;padding:12px 17px;font-weight:900;cursor:pointer;backdrop-filter:blur(7px);animation:pulse 1.8s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #ff5a2218;border-color:#ff7040}}.door{right:24%;top:46%}.boardHot{right:24%;top:20%}.tableHot{right:17%;top:57%}.staff{position:absolute;z-index:7;right:13%;bottom:0;width:210px;height:65%;filter:drop-shadow(0 20px 30px #000)}.staff .head{position:absolute;left:68px;top:10px;width:76px;height:92px;background:#d49a72;border-radius:48%}.staff .hair{position:absolute;left:60px;top:0;width:92px;height:48px;background:#1b130f;border-radius:50px 50px 18px 18px}.staff .body{position:absolute;left:30px;top:92px;width:160px;height:300px;background:#171717;border-radius:48px 48px 12px 12px}.staff .apron{position:absolute;left:48px;top:145px;width:125px;height:275px;background:#ad3618;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.bubble{position:absolute;z-index:9;right:26%;top:25%;max-width:330px;background:white;color:#17100c;border-radius:20px 20px 4px 20px;padding:16px 20px;font-weight:900;line-height:1.5}.menu{position:fixed;z-index:30;inset:5%;background:#0b0806f5;border:1px solid #ffffff20;border-radius:28px;padding:26px;display:none;overflow:auto;backdrop-filter:blur(20px)}.menu.on{display:block}.menuTop{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:#17110e;border:1px solid #ffffff18;border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#ff6936}.card img{width:100%;height:180px;object-fit:cover}.card section{padding:14px}.card b{display:block}.card small{display:block;color:#bba99b;margin-top:6px;line-height:1.4}.price{color:#ff7544;font-weight:900;margin-top:8px}.viewer{position:fixed;z-index:40;inset:0;background:#070503f7;display:none}.viewer.on{display:grid;grid-template-columns:45% 55%}.vcopy{padding:9%;display:flex;flex-direction:column;justify-content:center}.vcopy h2{font-size:clamp(36px,5vw,70px);line-height:.95;margin:8px 0 15px}.vcopy p{color:#cbbbac;line-height:1.7}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{border:1px solid #ffffff25;background:#18100c;padding:7px 10px;border-radius:99px;font-size:12px;color:#e9d7c8}.three{position:relative;background:radial-gradient(circle,#5b220e,#080604 68%)}.three canvas{width:100%!important;height:100%!important}.side{position:absolute;right:18px;top:18px;background:#100b08d9;border:1px solid #ffffff1f;border-radius:18px;padding:14px;min-width:155px;z-index:2}.side b{color:#ff7544}.side span{display:block;font-size:12px;line-height:1.8;color:#dbcbbb;margin-top:7px}.dialog{position:fixed;z-index:35;left:50%;bottom:5%;transform:translateX(-50%);width:min(700px,90%);background:#0e0a08ef;border:1px solid #ffffff22;border-radius:24px;padding:20px;display:none;backdrop-filter:blur(15px)}.dialog.on{display:block}.dialog h3{margin:0 0 13px}.cart{position:fixed;z-index:25;right:3%;bottom:3%;background:#f4e8d8;color:#17100c;border-radius:18px;padding:13px 17px;font-weight:900;display:none}.cart.on{display:block}.receipt{position:fixed;z-index:50;inset:0;background:#080604ee;display:none;place-items:center}.receipt.on{display:grid}.paper{background:#f7eddf;color:#20150e;width:min(430px,90%);padding:30px;border-radius:20px;text-align:center}.paper h2{margin-top:0}.paper hr{border:0;border-top:1px dashed #7d6d61}.close{border:1px solid #ffffff2a;background:#1c130f;color:white;border-radius:99px;padding:10px 14px;cursor:pointer}@media(max-width:800px){.narr{left:6%;right:6%;bottom:6%}.narr p{font-size:14px}.staff{right:-7%;opacity:.7}.bubble{right:5%;top:19%;font-size:13px}.grid{grid-template-columns:1fr}.card img{height:190px}.viewer.on{grid-template-columns:1fr;grid-template-rows:45% 55%}.three{grid-row:1}.vcopy{padding:6%;overflow:auto}.vcopy h2{font-size:32px}.menu{inset:2%;padding:16px}.hot{font-size:12px}}</style></head><body><div class="app"><div class="stage"><div class="bg" id="bg"></div><div class="shade"></div><div id="world"></div></div><header class="top"><b class="logo">FLAME BURGER</b><span class="step" id="step">OUTSIDE · 00</span></header><main class="narr" id="narr"></main></div>
<div class="menu" id="menu"><div class="menuTop"><div><div class="ey">COUNTER MENU BOARD</div><h2>고개를 들어 메뉴를 골라보세요.</h2></div><button class="close" onclick="closeMenu()">×</button></div><div class="grid" id="grid"></div></div>
<div class="viewer" id="viewer"><div class="vcopy"><div class="ey">YOUR BURGER · 3D</div><h2 id="vn"></h2><p id="vd"></p><strong id="vp" style="color:#ff7140;font-size:24px"></strong><div class="chips" id="chips"></div><div class="actions"><button class="btn" onclick="chooseBurger()">이걸로 주문</button><button class="btn alt" onclick="toggleExplode()">재료 펼치기</button><button class="btn alt" onclick="backMenu()">다른 메뉴</button></div></div><div class="three" id="three"><div class="side"><b>재료 구성</b><span id="sideIng"></span></div></div></div>
<div class="dialog" id="dialog"></div><div class="cart" id="cart"></div><div class="receipt" id="receipt"><div class="paper" id="paper"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const pics={outside:"https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=2200&q=90",counter:"https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?auto=format&fit=crop&w=2200&q=90",dining:"https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=2200&q=90",kitchen:"https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=2200&q=90",exit:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=2200&q=90"};
const foods=[
['FLAME SIGNATURE',8900,'스매시 비프와 체더, 플레임 소스의 시그니처','https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=88',['브리오슈 번','스매시 비프','체더','양상추','토마토','그릴드 어니언','플레임 소스'],0],
['GARLIC DOUBLE CHEESE',9900,'더블 패티와 더블 치즈, 진한 갈릭 버터','https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=900&q=88',['브리오슈 번','비프 패티 ×2','체더 ×2','로스티드 갈릭','갈릭 버터'],1],
['BBQ BACON',9500,'크리스피 베이컨과 스모키 BBQ','https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=900&q=88',['브리오슈 번','비프 패티','체더','베이컨','양파','BBQ 소스'],2],
['TRUFFLE MUSHROOM',9800,'구운 버섯과 부드러운 트러플 크림','https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?auto=format&fit=crop&w=900&q=88',['브리오슈 번','비프 패티','스위스 치즈','구운 버섯','트러플 크림'],3],
['SPICY JALAPEÑO',9300,'할라피뇨와 칠리 마요의 매콤함','https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=900&q=88',['브리오슈 번','비프 패티','페퍼잭','할라피뇨','양상추','칠리 마요'],4],
['HAWAIIAN FIRE',9300,'그릴 파인애플과 스모키 핫소스','https://images.unsplash.com/photo-1603064752734-4c48eff53d05?auto=format&fit=crop&w=900&q=88',['브리오슈 번','비프 패티','파인애플','치즈','양상추','핫소스'],5]];
grid.innerHTML=foods.map((f,i)=>'<article class="card" onclick="viewFood('+i+')"><img src="'+f[3]+'"><section><b>'+f[0]+'</b><small>'+f[2]+'</small><div class="price">₩'+f[1].toLocaleString()+'</div></section></article>').join('');
let state='outside',sel=0,order={burger:null,set:false,drink:'',type:'',total:0};
function bg(k,zoom=1.06){const b=document.getElementById('bg');b.style.opacity=.25;setTimeout(()=>{b.style.backgroundImage='url("'+pics[k]+'")';b.style.transform='scale('+zoom+')';b.style.opacity=1},220)}
function staff(){return '<div class="staff"><i class="hair"></i><i class="head"></i><i class="body"></i><i class="apron"></i></div>'}
function render(s){state=s;world.innerHTML='';dialog.classList.remove('on');if(s==='outside'){bg('outside');step.textContent='OUTSIDE · 00';narr.innerHTML='<div class="ey">FIRST PERSON VISIT</div><h1>FLAME BURGER<br>앞에 도착했습니다.</h1><p>화면 속 출입문을 눌러 직접 매장으로 들어가세요.</p>';world.innerHTML='<button class="hot door" onclick="render(\'enter\')">🚪 문 열기</button>'}
if(s==='enter'){bg('outside',1.28);step.textContent='ENTRANCE · 01';narr.innerHTML='<div class="ey">ENTERING</div><h1>문을 열고<br>들어갑니다.</h1><p>카메라가 출입문을 통과해 카운터 앞으로 이동합니다.</p>';setTimeout(()=>render('counter'),1300)}
if(s==='counter'){bg('counter',1.13);step.textContent='COUNTER · 02';world.innerHTML=staff()+'<div class="bubble">어서 오세요! 위 메뉴판을 보시고 어떤 메뉴로 드릴지 골라주세요.</div><button class="hot boardHot" onclick="lookMenu()">👆 메뉴판 올려다보기</button>';narr.innerHTML='<div class="ey">AT THE COUNTER</div><h1>카운터 앞에<br>섰습니다.</h1><p>직원이 위쪽 메뉴판을 가리킵니다. 메뉴판을 눌러 시선을 올려보세요.</p>'}}
function lookMenu(){bg('counter',1.24);setTimeout(()=>menu.classList.add('on'),350)}function closeMenu(){menu.classList.remove('on')}function backMenu(){viewer.classList.remove('on');menu.classList.add('on')}
function viewFood(i){sel=i;let f=foods[i];menu.classList.remove('on');viewer.classList.add('on');vn.textContent=f[0];vd.textContent=f[2];vp.textContent='₩'+f[1].toLocaleString();chips.innerHTML=f[4].map(x=>'<span class="chip">'+x+'</span>').join('');sideIng.innerHTML=f[4].join('<br>');setup3D();build(f[5]);setTimeout(resize3D,30)}
function chooseBurger(){order.burger=foods[sel];order.total=foods[sel][1];viewer.classList.remove('on');askSet()}
function askSet(){dialog.classList.add('on');dialog.innerHTML='<h3>직원 · 세트로 변경하시겠어요?</h3><p>감자튀김 + 음료가 포함됩니다. (+₩3,500)</p><div class="actions"><button class="btn" onclick="setChoice(true)">세트로 주세요</button><button class="btn alt" onclick="setChoice(false)">단품으로 주세요</button></div>'}
function setChoice(v){order.set=v;if(v)order.total+=3500;askDrink()}
function askDrink(){dialog.innerHTML='<h3>직원 · 음료는 무엇으로 드릴까요?</h3><div class="actions"><button class="btn" onclick="drink(\'콜라\')">콜라</button><button class="btn" onclick="drink(\'제로콜라\')">제로콜라</button><button class="btn" onclick="drink(\'레몬에이드\')">레몬에이드</button><button class="btn alt" onclick="drink(\'없음\')">음료 없음</button></div>'}
function drink(v){order.drink=v;dialog.innerHTML='<h3>직원 · 매장에서 드시나요, 포장이신가요?</h3><div class="actions"><button class="btn" onclick="eatType(\'매장\')">🍽 매장에서 먹을게요</button><button class="btn alt" onclick="eatType(\'포장\')">🥡 포장할게요</button></div>'}
function eatType(v){order.type=v;dialog.innerHTML='<h3>주문 확인</h3><p><b>'+order.burger[0]+'</b><br>'+(order.set?'세트':'단품')+' · '+order.drink+' · '+v+'<br><br><strong style="color:#ff7040">₩'+order.total.toLocaleString()+'</strong></p><div class="actions"><button class="btn" onclick="pay()">주문 확정</button><button class="btn alt" onclick="lookMenu()">메뉴 다시 보기</button></div>'}
function pay(){dialog.classList.remove('on');cart.classList.add('on');cart.textContent='주문 #F'+Math.floor(100+Math.random()*899)+' · ₩'+order.total.toLocaleString();if(order.type==='매장')renderDining();else renderPickup()}
function renderDining(){bg('dining');step.textContent='DINING · 04';world.innerHTML='<button class="hot tableHot" onclick="kitchen()">🪑 이 자리 선택</button>';narr.innerHTML='<div class="ey">DINE IN</div><h1>이제 앉을 자리를<br>골라보세요.</h1><p>홀 안쪽까지 둘러보고 마음에 드는 테이블을 선택합니다.</p>'}
function kitchen(){bg('kitchen');step.textContent='OPEN KITCHEN · 05';narr.innerHTML='<div class="ey">YOUR ORDER IS COOKING</div><h1>주문과 동시에<br>불이 켜집니다.</h1><p>오픈키친에서 패티를 굽고 주문한 버거를 만드는 동안 잠시 기다립니다.</p><div class="actions"><button class="btn" onclick="finish()">음식 받기 →</button></div>';world.innerHTML=''}
function renderPickup(){bg('counter');step.textContent='PICKUP · 04';world.innerHTML=staff()+'<div class="bubble">포장 준비해드릴게요. 잠시만 기다려주세요!</div>';narr.innerHTML='<div class="ey">TAKE OUT</div><h1>픽업존에서<br>기다립니다.</h1><p>주문하신 메뉴가 준비되면 직원이 주문번호를 불러드립니다.</p><div class="actions"><button class="btn" onclick="finish()">포장 수령하기 →</button></div>'}
function finish(){bg('exit');cart.classList.remove('on');step.textContent='EXIT · 06';world.innerHTML='';narr.innerHTML='<div class="ey">VISIT COMPLETE</div><h1>문을 열고<br>매장을 나갑니다.</h1><p>주문부터 좌석/포장까지 하나의 방문 동선으로 이어졌습니다.</p><div class="actions"><button class="btn" onclick="showReceipt()">주문내역 보기</button><button class="btn alt" onclick="resetAll()">다시 방문하기</button></div>'}
function showReceipt(){receipt.classList.add('on');paper.innerHTML='<h2>FLAME BURGER</h2><p>'+order.burger[0]+'</p><p>'+(order.set?'SET':'SINGLE')+' · '+order.drink+' · '+order.type+'</p><hr><h2>₩'+order.total.toLocaleString()+'</h2><button class="btn" onclick="receipt.classList.remove(\'on\')">닫기</button>'}
function resetAll(){order={burger:null,set:false,drink:'',type:'',total:0};render('outside')}
let renderer,sc,cam,g,layers=[],spread=false,drag=false,lx=0,ly=0;
function mat(c,r=.7){return new THREE.MeshStandardMaterial({color:c,roughness:r})}function add(geo,ma,y){let o=new THREE.Mesh(geo,ma);o.position.y=y;g.add(o);layers.push({o,y});return o}
function setup3D(){if(renderer)return;let host=document.getElementById('three');sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(34,1,.1,100);cam.position.set(0,.15,8);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);sc.add(new THREE.HemisphereLight(0xffe2c7,0x2a0d05,3.4));let dl=new THREE.DirectionalLight(0xffa05e,4);dl.position.set(5,6,5);sc.add(dl);g=new THREE.Group();sc.add(g);host.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};window.onpointerup=()=>drag=false;window.onpointermove=e=>{if(drag){g.rotation.y+=(e.clientX-lx)*.01;g.rotation.x+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY}};host.onwheel=e=>{e.preventDefault();cam.position.z=Math.max(5,Math.min(11,cam.position.z+e.deltaY*.006))};addEventListener('resize',resize3D);anim()}
function build(k){while(g.children.length)g.remove(g.children[0]);layers=[];spread=false;add(new THREE.SphereGeometry(1.72,64,32,0,Math.PI*2,0,Math.PI/2),mat(0xd98a38,.82),1.5);for(let i=0;i<20;i++){let s=add(new THREE.CapsuleGeometry(.025,.12,3,6),mat(0xf3d398,.8),1.8+Math.random()*.28);s.position.x=(Math.random()-.5)*2.2;s.position.z=(Math.random()-.5)*1.5;s.rotation.z=Math.random()*2}add(new THREE.TorusGeometry(1.43,.17,16,64),mat(0x4b9a3b,.9),.77);if(k===5)add(new THREE.TorusGeometry(.85,.35,16,64),mat(0xe7ad24,.72),.52);add(new THREE.CylinderGeometry(1.48,1.48,.13,64),mat(k===4?0xf0b72c:0xffc82c,.6),.36);add(new THREE.CylinderGeometry(1.5,1.45,.48,64),mat(0x4a2117,1),.03);if(k===1){add(new THREE.CylinderGeometry(1.47,1.42,.45,64),mat(0x4a2117,1),-.43);add(new THREE.CylinderGeometry(1.48,1.48,.11,64),mat(0xffc82c,.6),-.68)}if(k===2){let b=add(new THREE.BoxGeometry(2.45,.12,.62),mat(0x9b3a22,.85),-.34);b.rotation.y=.18}if(k===3)for(let i=0;i<5;i++){let m=add(new THREE.SphereGeometry(.34,24,16),mat(0x8a6848,.9),-.32);m.position.x=(i-2)*.48;m.position.z=(i%2)*.32}if(k===4)for(let i=0;i<4;i++){let j=add(new THREE.TorusGeometry(.22,.08,12,28),mat(0x4d7f28,.85),-.3);j.position.x=(i-1.5)*.5;j.rotation.x=Math.PI/2}add(new THREE.CylinderGeometry(1.35,1.35,.13,64),mat(0xd94631,.8),-.55-(k===1?.35:0));add(new THREE.CylinderGeometry(1.56,1.48,.42,64),mat(0xd98a38,.82),-.88-(k===1?.35:0))}
function toggleExplode(){spread=!spread}function resize3D(){if(!renderer)return;let h=document.getElementById('three');renderer.setSize(h.clientWidth,h.clientHeight);cam.aspect=h.clientWidth/h.clientHeight;cam.updateProjectionMatrix()}function anim(){requestAnimationFrame(anim);layers.forEach((x,i)=>{let target=x.y+(i-(layers.length-1)/2)*(spread?.45:0);x.o.position.y+=(target-x.o.position.y)*.08});if(!drag)g.rotation.y+=.003;renderer.render(sc,cam)}
render('outside');
</script></body></html>
