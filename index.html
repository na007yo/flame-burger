function buildBurger(k){while(G.children.length)G.remove(G.children[0]);layers=[];spread=false;addPart(new THREE.SphereGeometry(1.72,64,32,0,Math.PI*2,0,Math.PI/2),mm(0xd98a38,.82),1.5);addPart(new THREE.TorusGeometry(1.43,.17,16,64),mm(0x4b9a3b,.9),.77);if(k===5)addPart(new THREE.TorusGeometry(.85,.35,16,64),mm(0xe7ad24,.72),.52);addPart(new THREE.CylinderGeometry(1.48,1.48,.13,64),mm(k===4?0xf0b72c:0xffc82c,.6),.36);addPart(new THREE.CylinderGeometry(1.5,1.45,.48,64),mm(0x4a2117,1),.03);if(k===1){addPart(new THREE.CylinderGeometry(1.47,1.42,.45,64),mm(0x4a2117,1),-.43);addPart(new THREE.CylinderGeometry(1.48,1.48,.11,64),mm(0xffc82c,.6),-.68)}if(k===2){let b=addPart(new THREE.BoxGeometry(2.45,.12,.62),mm(0x9b3a22,.85),-.34);b.rotation.y=.18}if(k===3)for(let i=0;i<5;i++){let m=addPart(new THREE.SphereGeometry(.34,24,16),mm(0x8a6848,.9),-.32);m.position.x=(i-2)*.48;m.position.z=(i%2)*.32}if(k===4)for(let i=0;i<4;i++){let j=addPart(new THREE.TorusGeometry(.22,.08,12,28),mm(0x4d7f28,.85),-.3);j.position.x=(i-1.5)*.5;j.rotation.x=Math.PI/2}addPart(new THREE.CylinderGeometry(1.35,1.35,.13,64),mm(0xd94631,.8),-.55-(k===1?.35:0));addPart(new THREE.CylinderGeometry(1.56,1.48,.42,64),mm(0xd98a38,.82),-.88-(k===1?.35:0))}
function showFood(i){sel=i;step(3);menuboard.classList.remove('on');let f=foods[i];menu.classList.remove('on');viewer.classList.add('on');vn.textContent=f[0];vd.textContent=f[2];vp.textContent='₩'+f[1].toLocaleString();chips.innerHTML=f[4].map(x=>'<span class="chip">'+x+'</span>').join('');recipe.innerHTML=f[4].join('<br>');initModel();buildBurger(f[5]);setTimeout(resizeModel,30)}function explode(){spread=!spread}function resizeModel(){if(!MR)return;let w=model.clientWidth,h=model.clientHeight;MR.setSize(w,h);MC.aspect=w/h;MC.updateProjectionMatrix()}function animModel(){requestAnimationFrame(animModel);layers.forEach((x,i)=>{let t=x.y+(i-(layers.length-1)/2)*(spread?.45:0);x.o.position.y+=(t-x.o.position.y)*.08});if(!mDrag)G.rotation.y+=.003;MR.render(MS,MC)}
function syncOrder(){if(!order.food){orderbar.classList.remove('on');return}orderbar.classList.add('on');orderbar.innerHTML='<b>현재 주문</b>'+order.food[0]+' · ₩'+order.total.toLocaleString()}function selectFood(){order.food=foods[sel];order.total=foods[sel][1];syncOrder();viewer.classList.remove('on');askSet()}function askSet(){dialog.classList.add('on');dialog.innerHTML='<h3>직원 · 세트로 변경하시겠어요?</h3><p>감자튀김 + 음료 (+₩3,500)</p><div class="actions"><button class="btn" onclick="setChoice(true)">세트</button><button class="btn alt" onclick="setChoice(false)">단품</button></div>'}function setChoice(v){order.set=v;if(v)order.total+=3500;syncOrder();dialog.innerHTML='<h3>직원 · 음료는 무엇으로 드릴까요?</h3><div class="actions"><button class="btn" onclick="drink(\'콜라\')">콜라</button><button class="btn" onclick="drink(\'제로콜라\')">제로콜라</button><button class="btn" onclick="drink(\'레몬에이드\')">레몬에이드</button></div>'}function drink(v){order.drink=v;dialog.innerHTML='<h3>직원 · 매장에서 드시나요, 포장이신가요?</h3><div class="actions"><button class="btn" onclick="eat(\'매장\')">매장에서</button><button class="btn alt" onclick="eat(\'포장\')">포장</button></div>'}function eat(v){order.type=v;step(4);dialog.innerHTML='<h3>주문 확인</h3><p>'+order.food[0]+' · '+(order.set?'세트':'단품')+' · '+order.drink+' · '+v+'<br><b style="color:#ff7040">₩'+order.total.toLocaleString()+'</b></p><button class="btn" onclick="finishOrder()">주문 확정</button>'}function finishOrder(){step(5);dialog.classList.remove('on');orderbar.classList.remove('on');if(order.type==='매장')loadNode(1);else loadNode(4);setTimeout(()=>{receipt.classList.add('on');paper.innerHTML='<h2>FLAME BURGER</h2><p>주문이 접수되었습니다.</p><hr><p>'+order.food[0]+'</p><p>'+(order.set?'SET':'SINGLE')+' · '+order.drink+' · '+order.type+'</p><h2>₩'+order.total.toLocaleString()+'</h2><button class="btn" onclick="receipt.classList.remove(\'on\')">가상매장 계속 둘러보기</button>'},450)}
</script></body></html>
